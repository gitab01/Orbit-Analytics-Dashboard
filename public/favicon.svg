<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark rounded background -->
  <rect width="32" height="32" rx="7" fill="#0d1117"/>

  <!-- Green orbit ring -->
  <circle cx="16" cy="16" r="11"
    stroke="#15b382" stroke-width="2.5"
    fill="none"/>

  <!-- White core dot -->
  <circle cx="16" cy="16" r="4" fill="#15b382"/>

  <!-- Upward trend line crossing the orbit -->
  <polyline
    points="7,22 13,15 18,18 25,9"
    stroke="#ffffff"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    opacity="0.9"/>

  <!-- Arrow head at trend tip -->
  <polyline
    points="22,8 25,9 24,12"
    stroke="#ffffff"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    opacity="0.9"/>
</svg>
