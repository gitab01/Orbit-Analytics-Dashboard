<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark background -->
  <rect width="32" height="32" rx="8" fill="#0f1117"/>

  <!-- Outer orbital ring -->
  <circle cx="16" cy="16" r="11" stroke="#15b382" stroke-width="2" stroke-dasharray="20 6" stroke-linecap="round" opacity="0.4"/>

  <!-- Middle orbital ring -->
  <circle cx="16" cy="16" r="7.5" stroke="#15b382" stroke-width="1.5" stroke-dasharray="14 4" stroke-linecap="round" opacity="0.7"/>

  <!-- Core dot — the "data point" -->
  <circle cx="16" cy="16" r="3" fill="#15b382"/>

  <!-- Orbit accent dot on outer ring -->
  <circle cx="16" cy="5" r="2" fill="#15b382"/>

  <!-- Upward trend arrow hint — top right -->
  <path d="M22 10 L26 6 M26 6 L26 9.5 M26 6 L22.5 6" stroke="#15b382" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
